apiVersion: apps/v1
kind: Deployment
metadata:
  name: static-web-site
  namespace: static-web
  labels:
    app: static-web-site
spec:
  replicas: 2
  selector:
    matchLabels:
      app: static-web-site
  template:
    metadata:
      labels:
        app: static-web-site
    spec:
      containers:
        - name: nginx
          image: rochel05/static_web_site_k8s-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80

          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "250m"

          # Vérifie que Nginx est bien alive
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

          # Vérifie que le pod est prêt
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
