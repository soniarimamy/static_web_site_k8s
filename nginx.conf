server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Servir les fichiers statiques
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API endpoint pour les infos du pod (simulé)
    location /api/info {
        default_type application/json;
        return 200 '{"podName": "hello-world-pod", "nodeName": "node1", "podIP": "10.244.0.1"}';
    }

    location /pod-info {
        default_type application/json;
        return 200 '{"podName": "hello-world-pod"}';
    }
}